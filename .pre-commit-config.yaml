repos:
  - repo: local
    hooks:
      - id: ruff
        name: ruff (linter)
        entry: ruff check
        language: system
        types: [python]
        pass_filenames: true

      - id: ruff-format
        name: ruff (formatter)
        entry: ruff format
        language: system
        types: [python]
        pass_filenames: true

      - id: mypy
        name: mypy (type check)
        entry: mypy
        language: system
        types: [python]
        pass_filenames: true
